services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cctp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cctp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cctp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cctp}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
